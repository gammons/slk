# GoReleaser config for slk
# Docs: https://goreleaser.com
version: 2

project_name: slk

before:
  hooks:
    - go mod tidy

# Two build entries because of cgo:
#
#   * darwin NEEDS CGO_ENABLED=1: golang.design/x/clipboard reads the macOS
#     pasteboard through Cocoa, which is cgo-only. The CGO_ENABLED=0 cask
#     binary made clipboard.Init() fail at startup and silently disabled
#     Ctrl+V smart-paste (issue #156). This requires the release workflow
#     to run on a macOS runner.
#   * linux/windows stay CGO_ENABLED=0: static binaries are what make the
#     deb/rpm/apk packages and the Windows zip portable. Linux Wayland paste
#     works without cgo (slk shells out to wl-paste); Linux X11 paste needs
#     cgo + libX11, and dynamically linking it would break musl/Alpine and
#     minimal containers, so release binaries keep X11 paste disabled.
builds:
  - id: slk-darwin
    main: ./cmd/slk
    binary: slk
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
  - id: slk
    main: ./cmd/slk
    binary: slk
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on arm64 is rare and not worth the matrix slot for a TUI
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: slk
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: Bug fixes
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: Performance
      regexp: "^.*perf[(\\w)]*:+.*$"
      order: 2
    - title: Other
      order: 999
  filters:
    # Scoped prefixes must be matched explicitly: "^chore:" does NOT
    # match "chore(ci): ...", so scoped internal commits were leaking
    # into user-facing notes (v0.16.0 shipped with "chore(ci): bump
    # golangci-lint" under Other). The (\(.*\))? makes the scope
    # optional so both spellings are excluded.
    exclude:
      - "^docs(\\(.*\\))?:"
      - "^test(\\(.*\\))?:"
      - "^chore(\\(.*\\))?:"
      - "^style(\\(.*\\))?:"
      - "^ci(\\(.*\\))?:"
      - "Merge pull request"
      - "Merge branch"

nfpms:
  - id: slk
    package_name: slk
    vendor: Grant Ammons
    homepage: https://github.com/gammons/slk
    maintainer: Grant Ammons <grant@grant.dev>
    description: |-
      A blazingly fast Slack TUI.
      Keyboard-driven, beautifully themed terminal client for Slack.
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    section: net
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/slk/LICENSE
      - src: ./README.md
        dst: /usr/share/doc/slk/README.md

release:
  github:
    owner: gammons
    name: slk
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## slk {{ .Tag }}

    A blazingly fast Slack TUI. Keyboard-driven, beautifully themed, under 20MB.
  # Two footers: one for pre-releases, one for stable.
  #
  # Everything here is PERMANENT config, so it carries only what is true
  # of every pre-release. Warnings specific to one release -- "this one
  # changes how slk talks to Slack, and Enterprise Grid is untested" --
  # belong in that release's body, not in a template that would still be
  # emitting them three betas later.
  #
  # The pre-release text deliberately omits the .deb/.rpm/.apk lines:
  # installing a beta system-wide through a package manager is a worse
  # idea than dropping a binary on $PATH, and the point of this channel
  # is that it stays easy to back out of.
  footer: |
    ---
    {{- if .Prerelease }}
    **This is a pre-release.** It is not published to the Homebrew tap, and
    `go install ...@latest` will not resolve to it. Both are deliberate:
    pre-releases are opt-in only, and nothing you already have installed
    will move to this by itself.

    - **Go:** `go install github.com/gammons/slk/cmd/slk@{{ .Tag }}`
    - **Linux/macOS:** download the `.tar.gz`, extract, and place `slk` in your `$PATH`
    - **Windows:** download the `.zip`, extract `slk.exe`, add to `PATH`

    Verify downloads with `checksums.txt`.

    **Please run it with debug logging on:**

    ```
    SLK_DEBUG=1 slk
    ```

    That writes `slk-debug.log` to the working directory. If anything looks
    wrong, that file is what makes a report actionable -- especially the
    request tally at the end of it:

    ```
    grep -A30 'shutdown API request tally' slk-debug.log
    ```

    Please report anything you find at
    https://github.com/gammons/slk/issues -- including "it seemed fine",
    which is genuinely useful and almost never gets sent.
    {{- else }}
    **Install**

    - **Linux/macOS:** download the appropriate `.tar.gz`, extract, and place `slk` in your `$PATH`
    - **Debian/Ubuntu:** `sudo dpkg -i slk_*.deb`
    - **Fedora/RHEL:** `sudo rpm -i slk_*.rpm`
    - **Alpine:** `sudo apk add --allow-untrusted slk_*.apk`
    - **Windows:** download the `.zip`, extract `slk.exe`, add to `PATH`
    - **Go:** `go install github.com/gammons/slk/cmd/slk@{{ .Tag }}`

    Verify downloads with `checksums.txt`.
    {{- end }}

# Homebrew tap.
#
# Casks, not formulas: goreleaser deprecated `brews` in v2.10 and the
# historical formula was a hack for installing pre-compiled binaries.
# Users still install with:
#
#     brew install gammons/tap/slk
#
# Two consequences of the move worth knowing:
#
#   1. The cask serves macOS AND Linux (Homebrew supports casks on Linux);
#      goreleaser generates on_macos and on_linux stanzas pointing at the
#      per-OS/arch tarballs.
#   2. The old pre-v0.13.0 formula was deleted from the tap and a
#      tap_migrations.json containing {"slk": "slk"} added, so `brew
#      upgrade` moves existing formula installs to the cask.
#
# The token is a fine-grained PAT scoped to the homebrew-tap repo with
# contents:write, stored as HOMEBREW_TAP_GITHUB_TOKEN in this repo's
# Actions secrets.
homebrew_casks:
  - name: slk
    repository:
      owner: gammons
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaser
      email: goreleaser@gammons.dev
    commit_msg_template: "slk: brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    homepage: https://github.com/gammons/slk
    description: A blazingly fast, keyboard-driven Slack TUI
    # Helps `brew audit` when the homepage and the download domain differ.
    url:
      verified: github.com/gammons/slk
    # Skip the prerelease tags goreleaser auto-flags so the tap only
    # tracks stable releases.
    skip_upload: auto
    binaries:
      - slk
    # slk's binaries are not signed or notarized, so macOS quarantines
    # them on download and Gatekeeper refuses to run them. Stripping the
    # attribute at install time is what goreleaser's migration guide
    # prescribes for unsigned casks.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/slk"]
          end

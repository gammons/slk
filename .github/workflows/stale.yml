name: stale

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    name: stale
    runs-on: ubuntu-latest
    # Forks don't need their pull requests warned about or closed.
    if: github.repository == 'gammons/slk'
    permissions:
      # actions/stale keeps its progress between runs in the Actions
      # cache and needs this to replace the saved state.
      actions: write
      # Labels and comments on pull requests go through the issues API.
      issues: write
      pull-requests: write
    steps:
      - name: Warn about and close inactive pull requests
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          # Pull requests only; issues are never marked stale or closed.
          days-before-issue-stale: -1
          days-before-issue-close: -1
          # Warn after 14 days without activity, close 7 days later.
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-label: stale
          remove-stale-when-updated: true
          stale-pr-message: >-
            This pull request has had no activity for 14 days. It will be
            closed in 7 days unless there's new activity (a push, a
            comment, or a review). Thanks for contributing to slk!
          close-pr-message: >-
            Closing this pull request after 21 days without activity. Feel
            free to reopen it, or open a new one, whenever you'd like to
            pick it back up.
          operations-per-run: 100

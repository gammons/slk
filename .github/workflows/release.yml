name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    # macOS runner, not Ubuntu: the darwin build sets CGO_ENABLED=1 so
    # clipboard paste works (issue #156), and cgo for darwin needs the
    # Apple SDK at link time. Go on macOS still cross-compiles the
    # CGO_ENABLED=0 linux/windows targets, and nfpm runs fine there, so a
    # single job covers every artifact.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # Uncomment after generating an AUR SSH key and adding it as a secret:
          # AUR_KEY: ${{ secrets.AUR_KEY }}

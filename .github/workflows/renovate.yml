name: renovate

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        type: choice
        default: info
        options:
          - info
          - debug

permissions:
  contents: read

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-latest
    # Forks track this repo; dependency PRs there would only create
    # go.mod conflicts on the next rebase.
    if: github.repository == 'gammons/slk'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Renovate
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        with:
          configurationFile: .github/renovate.json5
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          # The action runs renovate against whatever repositories it is
          # told about; without this it exits with "No repositories found"
          # and does nothing. github.repository keeps it pointing at this
          # repo (the job's if: guard already stops forks from running it).
          RENOVATE_REPOSITORIES: ${{ github.repository }}
